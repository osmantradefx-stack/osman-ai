<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Osman AI logo</title>
  <desc id="desc">A luminous blue and violet ring with sparkle accents above the Osman AI wordmark.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="68%">
      <stop offset="0" stop-color="#10152d"/>
      <stop offset="1" stop-color="#02040f"/>
    </radialGradient>
    <linearGradient id="ring" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0" stop-color="#19d5ff"/>
      <stop offset=".52" stop-color="#365cff"/>
      <stop offset="1" stop-color="#c13cff"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".7" stop-color="#fff"/>
      <stop offset="1" stop-color="#7a43ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="180" fill="url(#background)"/>
  <g fill="none" stroke="url(#ring)" filter="url(#glow)">
    <circle cx="512" cy="420" r="190" stroke-width="13"/>
    <path d="M512 315a105 105 0 1 0 0 210a105 105 0 1 1 0-210z" stroke-width="38"/>
  </g>
  <g fill="url(#ring)" filter="url(#glow)">
    <path d="m690 300 10 24 25 10-25 10-10 25-10-25-25-10 25-10z"/>
    <path d="m735 350 7 17 18 7-18 7-7 18-7-18-18-7 18-7z"/>
  </g>
  <text x="512" y="760" text-anchor="middle" fill="url(#wordmark)" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="700" letter-spacing="-4">Osman <tspan fill="#4980ff">AI</tspan></text>
</svg>
