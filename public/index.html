<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Osman AI</title>

    <style>
        :root {
            --bg: #070b14;
            --panel: #0d1422;
            --panel-2: #111a2b;
            --border: #1d2a40;
            --blue: #2388ff;
            --blue-hover: #1675e8;
            --text: #f5f7fb;
            --muted: #8995aa;
            --user: #176ee6;
            --assistant: #151f31;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: var(--bg);
            color: var(--text);
        }

        /* APP */

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        /* HEADER */

        .header {
            height: 64px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 16px;

            background: rgba(13, 20, 34, 0.96);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .logo {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--blue);

            font-size: 20px;
        }

        .brand-text h1 {
            font-size: 17px;
            font-weight: 700;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 5px;

            margin-top: 2px;

            color: var(--muted);
            font-size: 11px;
        }

        .online {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
        }

        .new-chat {
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);

            padding: 8px 11px;
            border-radius: 9px;

            cursor: pointer;
            font-size: 12px;
        }

        .new-chat:active {
            transform: scale(0.96);
        }

        /* CHAT */

        .chat-container {
            flex: 1;
            min-height: 0;

            display: flex;
            flex-direction: column;

            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .chat-messages {
            flex: 1;
            min-height: 0;

            overflow-y: auto;

            padding: 25px 16px 120px;
            background: var(--bg);
        }

        /* WELCOME */

        .welcome {
            min-height: 60%;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 30px 20px;
        }

        .welcome-logo {
            width: 72px;
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background: var(--blue);

            font-size: 34px;

            margin-bottom: 18px;
        }

        .welcome h2 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .welcome p {
            max-width: 420px;

            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        /* MESSAGES */

        .message {
            display: flex;
            gap: 10px;

            margin-bottom: 20px;

            animation: appear 0.2s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message p {
            white-space: pre-line;
            overflow-wrap: anywhere;
            line-height: 1.6;
        }

        .message::before {
            width: 34px;
            height: 34px;
            min-width: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 16px;
        }

        .assistant-message::before {
            content: "🤖";
            background: var(--blue);
        }

        .user-message {
            justify-content: flex-end;
        }

        .user-message::before {
            content: "👤";
            order: 2;
            background: #293447;
        }

        .message p {
            max-width: min(75%, 650px);

            padding: 12px 15px;

            border-radius: 15px;

            font-size: 14px;
        }

        .assistant-message p {
            background: var(--assistant);
            border-top-left-radius: 5px;
        }

        .user-message p {
            order: 1;

            background: var(--user);

            border-top-right-radius: 5px;
        }

        /* TYPING */

        .typing-indicator {
            display: none;

            max-width: 900px;
            width: 100%;

            margin: 0 auto;

            padding: 0 16px 10px;

            color: var(--muted);
            font-size: 12px;
        }

        .typing-indicator.visible {
            display: block;
        }

        /* INPUT */

        .message-input {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;

            display: flex;
            gap: 8px;

            padding: 12px;

            background: linear-gradient(
                transparent,
                var(--bg) 25%
            );
        }

        .input-box {
            width: 100%;
            max-width: 900px;

            margin: 0 auto;

            display: flex;
            gap: 8px;

            padding: 7px;

            background: var(--panel);
            border: 1px solid var(--border);

            border-radius: 15px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        #user-input {
            flex: 1;

            border: none;
            outline: none;

            resize: none;

            min-height: 42px;
            max-height: 140px;

            padding: 11px 12px;

            background: transparent;

            color: var(--text);

            font-family: inherit;
            font-size: 14px;
        }

        #user-input::placeholder {
            color: #69758a;
        }

        #send-button {
            width: 44px;
            height: 44px;

            flex-shrink: 0;

            border: none;
            border-radius: 11px;

            background: var(--blue);
            color: white;

            font-size: 19px;
            font-weight: bold;

            cursor: pointer;
        }

        #send-button:hover {
            background: var(--blue-hover);
        }

        #send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* FOOTER */

        footer {
            display: none;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .header {
                height: 60px;
                padding: 0 12px;
            }

            .logo {
                width: 36px;
                height: 36px;
                font-size: 18px;
            }

            .brand-text h1 {
                font-size: 16px;
            }

            .chat-messages {
                padding: 20px 12px 115px;
            }

            .message p {
                max-width: 82%;
                font-size: 14px;
            }

            .welcome-logo {
                width: 64px;
                height: 64px;
                font-size: 30px;
            }

            .welcome h2 {
                font-size: 23px;
            }

            .new-chat {
                padding: 7px 9px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <div class="logo">
                🤖
            </div>

            <div class="brand-text">

                <h1>Osman AI</h1>

                <div class="status">
                    <span class="online"></span>
                    Online
                </div>

            </div>

        </div>

        <button
            class="new-chat"
            id="new-chat"
            type="button"
        >
            + New chat
        </button>

    </header>


    <!-- CHAT -->

    <div class="chat-container">

        <div
            id="chat-messages"
            class="chat-messages"
        >

            <div class="welcome" id="welcome">

                <div class="welcome-logo">
                    🤖
                </div>

                <h2>Welcome to Osman AI</h2>

                <p>
                    Your personal AI assistant for coding,
                    business, learning, technology and more.
                </p>

            </div>

        </div>


        <div
            class="typing-indicator"
            id="typing-indicator"
        >
            Osman AI is thinking...
        </div>


        <!-- INPUT -->

        <div class="message-input">

            <div class="input-box">

                <textarea
                    id="user-input"
                    placeholder="Ask Osman AI..."
                    rows="1"
                    autofocus
                ></textarea>

                <button
                    id="send-button"
                    type="button"
                    aria-label="Send message"
                >
                    ➤
                </button>

            </div>

        </div>

    </div>


    <footer>
        Osman AI
    </footer>

</div>


<!-- KEEP THE ORIGINAL CHAT ENGINE -->

<script src="chat.js"></script>

<script>

    /*
     * New chat button
     * This only clears the visible conversation.
     */

    const newChatButton =
        document.getElementById("new-chat");

    const chatMessages =
        document.getElementById("chat-messages");

    const welcomeHTML = `
        <div class="welcome" id="welcome">

            <div class="welcome-logo">
                🤖
            </div>

            <h2>Welcome to Osman AI</h2>

            <p>
                Your personal AI assistant for coding,
                business, learning, technology and more.
            </p>

        </div>
    `;

    newChatButton.addEventListener("click", () => {

        chatMessages.innerHTML = welcomeHTML;

        document.getElementById("user-input").focus();

    });

</script>

</body>
</html>
