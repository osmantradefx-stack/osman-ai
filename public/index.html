<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Osman AI</title>

<link rel="icon" href="/logo.png">

<style>
:root{
    --bg:#212121;
    --sidebar:#171717;
    --surface:#2f2f2f;
    --border:#3d3d3d;
    --text:#ececec;
    --muted:#9ca3af;
    --blue:#3b82f6;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif;

    background:var(--bg);
    color:var(--text);
    overflow:hidden;
}

/* APP */

.app{
    display:flex;
    height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    background:var(--sidebar);
    border-right:1px solid #2c2c2c;
    display:flex;
    flex-direction:column;
    transition:0.3s;
}

.sidebar-header{
    padding:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand img{
    width:38px;
    height:38px;
    border-radius:50%;
    object-fit:cover;
}

.brand-name{
    font-weight:700;
    font-size:16px;
}

.new-chat{
    margin:15px;
    padding:12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:transparent;
    color:white;
    cursor:pointer;
}

.new-chat:hover{
    background:#2d2d2d;
}

.sidebar-footer{
    margin-top:auto;
    padding:15px;
    color:var(--muted);
    font-size:12px;
}

/* MAIN */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

/* TOP */

.topbar{
    height:60px;
    border-bottom:1px solid #2c2c2c;
    display:flex;
    align-items:center;
    padding:0 16px;
    gap:15px;
}

.menu-btn{
    display:none;
    font-size:24px;
    background:none;
    border:none;
    color:white;
}

.top-logo{
    width:32px;
    height:32px;
    border-radius:50%;
}

.online{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#22c55e;
    display:inline-block;
    margin-left:8px;
}

/* CHAT */

.chat-container{
    flex:1;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.chat-messages{
    flex:1;
    overflow-y:auto;
    padding:30px 20px 150px;
}

.chat-inner{
    max-width:760px;
    margin:auto;
}

/* WELCOME */

.welcome{
    min-height:60vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.welcome-logo{
    width:70px;
    height:70px;
    border-radius:20px;
    margin-bottom:20px;
}

.welcome h1{
    font-size:32px;
    margin-bottom:10px;
}

.welcome p{
    color:var(--muted);
    max-width:500px;
}

/* MESSAGES */

.message{
    margin-bottom:25px;
}

.message p{
    line-height:1.7;
    white-space:pre-wrap;
}

.user-message{
    display:flex;
    justify-content:flex-end;
}

.user-message p{
    background:#303030;
    padding:12px 16px;
    border-radius:20px;
    max-width:75%;
}

.assistant-message{
    display:flex;
    gap:15px;
}

.assistant-message::before{
    content:"";
    width:32px;
    height:32px;
    border-radius:8px;
    background-image:url('/logo.png');
    background-size:cover;
    flex-shrink:0;
}

/* INPUT */

.message-input{
    position:fixed;
    bottom:0;
    left:260px;
    right:0;
    padding:20px;
    background:
    linear-gradient(
        transparent,
        var(--bg) 30%
    );
}

.input-box{
    max-width:760px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:24px;
    padding:8px;
}

#user-input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    resize:none;
    color:white;
    padding:12px;
    max-height:150px;
    font-size:15px;
}

#send-button{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:white;
    color:black;
    cursor:pointer;
    font-size:18px;
}

.typing-indicator{
    display:none;
    max-width:760px;
    margin:auto;
    color:var(--muted);
    padding-bottom:10px;
}

.typing-indicator.visible{
    display:block;
}

/* MOBILE */

@media(max-width:768px){

.sidebar{
    position:fixed;
    z-index:100;
    left:-260px;
    height:100%;
}

.sidebar.open{
    left:0;
}

.menu-btn{
    display:block;
}

.message-input{
    left:0;
}

.chat-messages{
    padding:20px 10px 140px;
}

.welcome h1{
    font-size:25px;
}

}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">

<div class="sidebar-header">

<div class="brand">
<img src="/logo.png" alt="Osman AI">
<div class="brand-name">
Osman AI
</div>
</div>

</div>

<button class="new-chat" id="new-chat">
＋ New Chat
</button>

<div class="sidebar-footer">
Osman AI • Personal Assistant
</div>

</div>

<!-- MAIN -->

<div class="main">

<div class="topbar">

<button class="menu-btn" id="menu-btn">
☰
</button>

<img src="/logo.png" class="top-logo">

<div>
Osman AI
<span class="online"></span>
</div>

</div>

<div class="chat-container">

<div class="chat-messages" id="chat-messages">

<div class="chat-inner">

<div class="welcome">

<img src="/logo.png" class="welcome-logo">

<h1>
How can I help you today?
</h1>

<p>
I'm Osman AI, your personal AI assistant.
Ask me anything.
</p>

</div>

</div>

</div>

<div class="typing-indicator" id="typing-indicator">
Osman AI is thinking...
</div>

<div class="message-input">

<div class="input-box">

<textarea
id="user-input"
placeholder="Message Osman AI..."
rows="1"></textarea>

<button id="send-button">
↑
</button>

</div>

</div>

</div>

</div>

</div>

<script src="chat.js"></script>

<script>

/* MOBILE MENU */

const menuBtn =
document.getElementById("menu-btn");

const sidebar =
document.getElementById("sidebar");

menuBtn.addEventListener(
"click",
()=>{
sidebar.classList.toggle("open");
}
);

/* NEW CHAT */

document
.getElementById("new-chat")
.addEventListener(
"click",
()=>{

document
.getElementById("chat-messages")
.innerHTML=
`
<div class="chat-inner">

<div class="welcome">

<img src="/logo.png"
class="welcome-logo">

<h1>
How can I help you today?
</h1>

<p>
I'm Osman AI,
your personal AI assistant.
</p>

</div>

</div>
`;

}
);

</script>

</body>
</html>
