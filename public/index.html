<!doctype html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Osman AI</title>

<link
rel="icon"
type="image/png"
href="/logo.png">

<style>

/* =========================
   VARIABLES
========================= */

:root{

--bg:#212121;
--sidebar:#171717;
--surface:#2f2f2f;
--surface-hover:#383838;
--border:#404040;

--text:#f5f5f5;
--muted:#a3a3a3;

--accent:#4f8cff;

}

/* =========================
   RESET
========================= */

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,
body{
width:100%;
height:100%;
}

body{

font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Roboto,
Arial,
sans-serif;

background:var(--bg);

color:var(--text);

overflow:hidden;

}

/* =========================
   APP
========================= */

.app{

display:flex;

width:100%;
height:100vh;

}

/* =========================
   SIDEBAR
========================= */

.sidebar{

width:260px;

background:var(--sidebar);

display:flex;

flex-direction:column;

border-right:
1px solid #2b2b2b;

transition:
transform .28s ease;

z-index:100;

}

.sidebar-header{

padding:18px;

}

.brand{

display:flex;

align-items:center;

gap:11px;

}

.brand img{

width:38px;
height:38px;

border-radius:50%;

object-fit:cover;

}

.brand-name{

font-weight:700;

font-size:17px;

}

.new-chat{

margin:8px 14px 15px;

padding:12px 14px;

border:1px solid var(--border);

border-radius:10px;

background:transparent;

color:white;

font-size:14px;

cursor:pointer;

transition:
background .2s,
transform .15s;

}

.new-chat:hover{

background:var(--surface);

}

.new-chat:active{

transform:scale(.97);

}

.sidebar-bottom{

margin-top:auto;

padding:16px;

font-size:12px;

color:var(--muted);

}

/* =========================
   MAIN
========================= */

.main{

flex:1;

min-width:0;

display:flex;

flex-direction:column;

}

/* =========================
   TOPBAR
========================= */

.topbar{

height:60px;

display:flex;

align-items:center;

gap:12px;

padding:0 18px;

border-bottom:
1px solid #2d2d2d;

}

.top-logo{

width:32px;
height:32px;

border-radius:50%;

}

.menu-button{

display:none;

border:0;

background:none;

color:white;

font-size:24px;

cursor:pointer;

}

/* =========================
   CHAT
========================= */

.chat-container{

position:relative;

flex:1;

min-height:0;

}

.chat-messages{

height:100%;

overflow-y:auto;

padding:
30px 20px 170px;

scroll-behavior:smooth;

}

.chat-inner{

width:100%;

max-width:780px;

margin:auto;

}

/* =========================
   WELCOME
========================= */

.welcome{

min-height:60vh;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

text-align:center;

animation:
welcomeIn .5s ease;

}

@keyframes welcomeIn{

from{

opacity:0;

transform:
translateY(12px);

}

to{

opacity:1;

transform:
translateY(0);

}

}

.welcome-logo{

width:82px;
height:82px;

border-radius:22px;

margin-bottom:22px;

box-shadow:
0 0 35px
rgba(79,140,255,.18);

}

.welcome h1{

font-size:32px;

font-weight:600;

margin-bottom:10px;

}

.welcome p{

color:var(--muted);

font-size:15px;

}

/* =========================
   MESSAGE ANIMATION
========================= */

.message{

animation:
messageIn .25s ease;

margin-bottom:24px;

}

@keyframes messageIn{

from{

opacity:0;

transform:
translateY(8px)
scale(.99);

}

to{

opacity:1;

transform:
translateY(0)
scale(1);

}

}

/* =========================
   USER MESSAGE
========================= */

.user-message{

display:flex;

justify-content:flex-end;

}

.user-message p{

max-width:75%;

background:#303030;

padding:
11px 16px;

border-radius:
18px;

line-height:1.55;

white-space:pre-wrap;

}

/* =========================
   ASSISTANT
========================= */

.assistant-message{

display:flex;

gap:12px;

line-height:1.65;

}

.assistant-avatar{

width:32px;
height:32px;

border-radius:9px;

flex-shrink:0;

}

/* =========================
   GENERATED IMAGE
========================= */

.generated-image{

display:block;

max-width:100%;

width:auto;

border-radius:16px;

margin-top:10px;

box-shadow:
0 8px 30px
rgba(0,0,0,.3);

animation:
imageIn .4s ease;

}

@keyframes imageIn{

from{

opacity:0;

transform:
scale(.96);

}

to{

opacity:1;

transform:
scale(1);

}

}

/* =========================
   INPUT AREA
========================= */

.message-input{

position:absolute;

left:0;
right:0;
bottom:0;

padding:
25px 20px 20px;

background:
linear-gradient(
transparent,
var(--bg) 35%
);

}

.input-box{

max-width:780px;

margin:auto;

display:flex;

align-items:flex-end;

gap:6px;

background:var(--surface);

border:
1px solid var(--border);

border-radius:25px;

padding:7px;

box-shadow:
0 4px 20px
rgba(0,0,0,.15);

transition:
border .2s,
box-shadow .2s;

}

.input-box:focus-within{

border-color:#555;

box-shadow:
0 4px 25px
rgba(0,0,0,.25);

}

#user-input{

flex:1;

border:0;

outline:0;

resize:none;

background:transparent;

color:white;

font-size:15px;

line-height:1.5;

padding:
10px 9px;

max-height:150px;

}

#user-input::placeholder{

color:#999;

}

/* =========================
   INPUT BUTTONS
========================= */

.tool-button{

width:40px;
height:40px;

border:0;

border-radius:50%;

background:transparent;

color:#bdbdbd;

font-size:19px;

cursor:pointer;

transition:
background .2s,
color .2s,
transform .15s;

}

.tool-button:hover{

background:var(--surface-hover);

color:white;

}

.tool-button:active{

transform:scale(.9);

}

#send-button{

width:40px;
height:40px;

border:0;

border-radius:50%;

background:white;

color:#111;

font-size:19px;

cursor:pointer;

transition:
transform .15s;

}

#send-button:hover{

transform:scale(1.05);

}

#send-button:active{

transform:scale(.92);

}

/* =========================
   EMOJI PICKER
========================= */

.emoji-picker{

position:absolute;

bottom:82px;

left:calc(50% - 390px);

width:300px;

max-height:250px;

overflow-y:auto;

background:#2b2b2b;

border:
1px solid #444;

border-radius:15px;

padding:10px;

display:none;

grid-template-columns:
repeat(8,1fr);

gap:5px;

box-shadow:
0 10px 35px
rgba(0,0,0,.4);

}

.emoji-picker.open{

display:grid;

animation:
pickerIn .2s ease;

}

@keyframes pickerIn{

from{

opacity:0;

transform:
translateY(8px);

}

to{

opacity:1;

transform:
translateY(0);

}

}

.emoji{

border:0;

background:transparent;

font-size:22px;

padding:5px;

border-radius:7px;

cursor:pointer;

}

.emoji:hover{

background:#404040;

}

/* =========================
   IMAGE MODE
========================= */

.image-mode{

background:#315a9e;

color:white;

}

/* =========================
   TYPING
========================= */

.typing-indicator{

display:none;

max-width:780px;

margin:auto;

padding:
0 0 10px;

color:#999;

font-size:13px;

}

.typing-indicator.visible{

display:block;

}

.dots span{

animation:
blink 1.4s infinite;

}

.dots span:nth-child(2){

animation-delay:.2s;

}

.dots span:nth-child(3){

animation-delay:.4s;

}

@keyframes blink{

0%,80%,100%{
opacity:.2;
}

40%{
opacity:1;
}

}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

.sidebar{

position:fixed;

top:0;
bottom:0;
left:0;

transform:
translateX(-100%);

box-shadow:
10px 0 30px
rgba(0,0,0,.4);

}

.sidebar.open{

transform:
translateX(0);

}

.menu-button{

display:block;

}

.chat-messages{

padding:
20px 12px 160px;

}

.welcome h1{

font-size:25px;

}

.welcome-logo{

width:68px;
height:68px;

}

.user-message p{

max-width:85%;

}

.message-input{

padding:
20px 10px 12px;

}

.emoji-picker{

left:10px;

bottom:75px;

width:280px;

}

}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{

width:7px;

}

::-webkit-scrollbar-thumb{

background:#444;

border-radius:10px;

}

::-webkit-scrollbar-track{

background:transparent;

}

</style>

</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside
class="sidebar"
id="sidebar">

<div class="sidebar-header">

<div class="brand">

<img
src="/logo.png"
alt="Osman AI">

<div class="brand-name">
Osman AI
</div>

</div>

</div>

<button
class="new-chat"
id="new-chat">

＋ New Chat

</button>

<div class="sidebar-bottom">

Osman AI

<br>

Your personal AI assistant

</div>

</aside>


<!-- MAIN -->

<main class="main">


<!-- TOP BAR -->

<header class="topbar">

<button
class="menu-button"
id="menu-button">

☰

</button>

<img
src="/logo.png"
class="top-logo"
alt="Osman AI">

<strong>
Osman AI
</strong>

</header>


<!-- CHAT -->

<section
class="chat-container">


<div
id="chat-messages"
class="chat-messages">

<div class="chat-inner">

<div class="welcome">

<img
src="/logo.png"
class="welcome-logo"
alt="Osman AI">

<h1>
How can I help you today?
</h1>

<p>
Ask Osman AI anything.
</p>

</div>

</div>

</div>


<div
id="typing-indicator"
class="typing-indicator">

Osman AI is thinking
<span class="dots">
<span>.</span>
<span>.</span>
<span>.</span>
</span>

</div>


<!-- INPUT -->

<div class="message-input">

<!-- EMOJI PICKER -->

<div
id="emoji-picker"
class="emoji-picker">

</div>


<div class="input-box">


<!-- IMAGE BUTTON -->

<button
class="tool-button"
id="image-button"
title="Create image">

🖼️

</button>


<!-- EMOJI BUTTON -->

<button
class="tool-button"
id="emoji-button"
title="Emoji">

😊

</button>


<textarea
id="user-input"
rows="1"
placeholder="Message Osman AI...">
</textarea>


<button
id="send-button"
title="Send">

↑

</button>


</div>

</div>

</section>

</main>

</div>


<script src="chat.js"></script>


<script>

/* =========================
   ELEMENTS
========================= */

const input =
document.getElementById("user-input");

const sendButton =
document.getElementById("send-button");

const messages =
document.getElementById("chat-messages");

const sidebar =
document.getElementById("sidebar");

const menuButton =
document.getElementById("menu-button");

const newChat =
document.getElementById("new-chat");

const emojiButton =
document.getElementById("emoji-button");

const emojiPicker =
document.getElementById("emoji-picker");

const imageButton =
document.getElementById("image-button");


/* =========================
   MOBILE SIDEBAR
========================= */

menuButton.addEventListener(
"click",
()=>{

sidebar.classList.toggle(
"open"
);

}
);


/* =========================
   CLOSE SIDEBAR
========================= */

messages.addEventListener(
"click",
()=>{

sidebar.classList.remove(
"open"
);

}
);


/* =========================
   NEW CHAT
========================= */

newChat.addEventListener(
"click",
()=>{

messages.innerHTML = `

<div class="chat-inner">

<div class="welcome">

<img
src="/logo.png"
class="welcome-logo">

<h1>
How can I help you today?
</h1>

<p>
Ask Osman AI anything.
</p>

</div>

</div>

`;

sidebar.classList.remove(
"open"
);

}
);


/* =========================
   AUTO TEXTAREA HEIGHT
========================= */

input.addEventListener(
"input",
()=>{

input.style.height =
"auto";

input.style.height =
Math.min(
input.scrollHeight,
150
) + "px";

}
);


/* =========================
   ENTER TO SEND
========================= */

input.addEventListener(
"keydown",
(event)=>{

if(
event.key === "Enter" &&
!event.shiftKey
){

event.preventDefault();

sendButton.click();

}

}
);


/* =========================
   EMOJIS
========================= */

const emojis = [

"😀","😃","😄","😁","😆","😅","😂","🤣",

"😊","😇","🙂","🙃","😉","😌","😍","🥰",

"😘","😎","🤩","🥳","🤔","🤨","😐","😑",

"😶","🙄","😏","😣","😥","😮","🤐","😯",

"😪","😫","🥱","😴","🤗","🤭","🤫","🤔",

"🤪","😜","😝","😛","🤑","🤠","😈","👿",

"❤️","🧡","💛","💚","💙","💜","🖤","🤍",

"🔥","✨","⭐","💯","🚀","🎯","💡","💻",

"👍","👎","👏","🙌","🙏","💪","🤝","👀",

"🎉","🎊","😂","🤣","😭","😱","😡","🤯"

];

emojiPicker.innerHTML =
emojis.map(
emoji =>
`<button class="emoji">${emoji}</button>`
).join("");


emojiButton.addEventListener(
"click",
()=>{

emojiPicker.classList.toggle(
"open"
);

}
);


emojiPicker.addEventListener(
"click",
(event)=>{

if(
event.target.classList.contains(
"emoji"
)
){

const emoji =
event.target.textContent;

const start =
input.selectionStart;

const end =
input.selectionEnd;

input.value =
input.value.slice(0,start)
+
emoji
+
input.value.slice(end);

input.focus();

input.selectionStart =
input.selectionEnd =
start + emoji.length;

}

}
);


/* =========================
   IMAGE MODE
========================= */

let imageMode = false;

imageButton.addEventListener(
"click",
()=>{

imageMode =
!imageMode;

imageButton.classList.toggle(
"image-mode",
imageMode
);

if(imageMode){

input.placeholder =
"Describe the image you want...";

}else{

input.placeholder =
"Message Osman AI...";

}

input.focus();

}
);


/* =========================
   IMAGE GENERATION
========================= */

async function generateImage(
prompt
){

const userMessage =
document.createElement(
"div"
);

userMessage.className =
"message user-message";

userMessage.innerHTML =
`<p>🖼️ ${escapeHTML(prompt)}</p>`;

messages.appendChild(
userMessage
);


const assistantMessage =
document.createElement(
"div"
);

assistantMessage.className =
"message assistant-message";

assistantMessage.innerHTML = `

<img
src="/logo.png"
class="assistant-avatar">

<div>

Generating your image
<span class="dots">
<span>.</span>
<span>.</span>
<span>.</span>
</span>

</div>

`;

messages.appendChild(
assistantMessage
);

scrollToBottom();


try{

const response =
await fetch(
"/api/image",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
prompt
})

});

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error ||
"Image generation failed"
);

}


assistantMessage.innerHTML = `

<img
src="/logo.png"
class="assistant-avatar">

<div>

<img
src="${data.image}"
class="generated-image"
alt="${escapeHTML(prompt)}">

</div>

`;

}catch(error){

assistantMessage.innerHTML = `

<img
src="/logo.png"
class="assistant-avatar">

<div>

Sorry, I couldn't generate
that image.

</div>

`;

console.error(error);

}

scrollToBottom();

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHTML(
text
){

const div =
document.createElement(
"div"
);

div.textContent =
text;

return div.innerHTML;

}


/* =========================
   SMOOTH SCROLL
========================= */

function scrollToBottom(){

requestAnimationFrame(
()=>{

messages.scrollTo({

top:
messages.scrollHeight,

behavior:
"smooth"

});

}
);


/* =========================
   DETECT IMAGE MODE
========================= */

const originalSend =
sendButton.onclick;

sendButton.addEventListener(
"click",
()=>{

if(!imageMode)
return;

const prompt =
input.value.trim();

if(!prompt)
return;

input.value = "";

input.style.height =
"auto";

emojiPicker.classList.remove(
"open"
);

imageMode = false;

imageButton.classList.remove(
"image-mode"
);

input.placeholder =
"Message Osman AI...";

generateImage(prompt);

}
);


/* =========================
   IMAGE COMMAND
========================= */

/*

You can also type:

/image a futuristic city at night

*/

input.addEventListener(
"keydown",
(event)=>{

if(
event.key === "Enter" &&
!event.shiftKey
){

const value =
input.value.trim();

if(
value.toLowerCase()
.startsWith("/image ")
){

event.preventDefault();

const prompt =
value.substring(7).trim();

if(prompt){

input.value = "";

generateImage(prompt);

}

}

}

}
);

</script>

</body>

</html>
