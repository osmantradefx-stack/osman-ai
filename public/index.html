<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Osman AI</title>

  <link rel="icon" type="image/png" href="/logo.png">

  <style>
    :root {
      --bg: #212121;
      --sidebar: #171717;
      --surface: #2f2f2f;
      --surface-hover: #3a3a3a;
      --border: #414141;
      --text: #f5f5f5;
      --muted: #a0a0a0;
      --accent: #4f8cff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* =========================
       APP
    ========================= */

    .app {
      display: flex;
      width: 100%;
      height: 100dvh;
      position: relative;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 260px;
      height: 100%;
      flex-shrink: 0;

      background: var(--sidebar);
      border-right: 1px solid #2b2b2b;

      display: flex;
      flex-direction: column;

      z-index: 1000;

      transition:
        transform 0.28s cubic-bezier(.4, 0, .2, 1);
    }

    .sidebar-header {
      padding: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 50%;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 700;
    }

    .new-chat {
      margin: 8px 14px 15px;
      padding: 13px 14px;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: transparent;
      color: white;

      font-size: 14px;
      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.15s ease;
    }

    .new-chat:hover {
      background: var(--surface);
    }

    .new-chat:active {
      transform: scale(0.97);
    }

    .sidebar-bottom {
      margin-top: auto;
      padding: 18px;

      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    /* =========================
       MOBILE OVERLAY
    ========================= */

    .sidebar-overlay {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.55);

      opacity: 0;
      visibility: hidden;

      z-index: 900;

      transition:
        opacity 0.25s ease,
        visibility 0.25s ease;
    }

    .sidebar-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      flex: 1;
      min-width: 0;
      height: 100%;

      display: flex;
      flex-direction: column;
    }

    /* =========================
       TOPBAR
    ========================= */

    .topbar {
      height: 60px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      gap: 12px;

      padding: 0 18px;

      border-bottom: 1px solid #2d2d2d;
    }

    .top-logo {
      width: 32px;
      height: 32px;

      border-radius: 50%;
      object-fit: cover;
    }

    .menu-button {
      display: none;

      width: 40px;
      height: 40px;

      border: 0;
      border-radius: 9px;

      background: transparent;
      color: white;

      font-size: 23px;
      cursor: pointer;
    }

    .menu-button:hover {
      background: var(--surface);
    }

    .online-dot {
      display: inline-block;

      width: 7px;
      height: 7px;

      margin-left: 6px;

      border-radius: 50%;
      background: #22c55e;
    }

    /* =========================
       CHAT
    ========================= */

    .chat-container {
      position: relative;

      flex: 1;
      min-height: 0;

      overflow: hidden;
    }

    .chat-messages {
      width: 100%;
      height: 100%;

      overflow-y: auto;

      padding:
        25px 20px 175px;

      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .chat-inner {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
    }

    /* =========================
       WELCOME
    ========================= */

    .welcome {
      min-height: 65vh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;

      animation: welcomeIn 0.5s ease;
    }

    .welcome-logo {
      width: 82px;
      height: 82px;

      object-fit: cover;
      border-radius: 22px;

      margin-bottom: 22px;

      box-shadow:
        0 0 35px rgba(79, 140, 255, 0.18);
    }

    .welcome h1 {
      font-size: 32px;
      font-weight: 600;

      margin-bottom: 10px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 15px;
    }

    @keyframes welcomeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       MESSAGES
    ========================= */

    .message {
      margin-bottom: 25px;

      animation:
        messageIn 0.25s ease;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform:
          translateY(8px)
          scale(0.99);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    /* USER */

    .user-message {
      display: flex;
      justify-content: flex-end;
    }

    .user-message p {
      max-width: 75%;

      padding:
        11px 16px;

      border-radius: 18px;

      background: #303030;

      line-height: 1.6;
      white-space: pre-wrap;

      word-break: break-word;
    }

    /* ASSISTANT */

    .assistant-message {
      display: flex;
      gap: 12px;

      line-height: 1.7;
    }

    .assistant-avatar {
      width: 32px;
      height: 32px;

      flex-shrink: 0;

      border-radius: 9px;
      object-fit: cover;
    }

    .assistant-content {
      min-width: 0;
      max-width: 100%;
      word-break: break-word;
    }

    /* =========================
       GENERATED IMAGE
    ========================= */

    .generated-image {
      display: block;

      width: auto;
      max-width: 100%;

      border-radius: 16px;

      margin-top: 5px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.35);

      animation: imageIn 0.4s ease;
    }

    @keyframes imageIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* =========================
       TYPING
    ========================= */

    .typing-indicator {
      display: none;

      max-width: 780px;
      margin: 0 auto;

      padding: 0 0 10px;

      color: #999;
      font-size: 13px;
    }

    .typing-indicator.visible {
      display: block;
    }

    .dots span {
      animation: blink 1.4s infinite;
    }

    .dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%,
      80%,
      100% {
        opacity: 0.2;
      }

      40% {
        opacity: 1;
      }
    }

    /* =========================
       INPUT AREA
    ========================= */

    .message-input {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      padding:
        25px 20px 20px;

      background:
        linear-gradient(
          transparent,
          var(--bg) 35%
        );

      z-index: 20;
    }

    .input-box {
      max-width: 780px;
      margin: 0 auto;

      display: flex;
      align-items: flex-end;
      gap: 4px;

      padding: 7px;

      background: var(--surface);

      border:
        1px solid var(--border);

      border-radius: 25px;

      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.15);

      transition:
        border 0.2s ease,
        box-shadow 0.2s ease;
    }

    .input-box:focus-within {
      border-color: #555;

      box-shadow:
        0 4px 25px rgba(0, 0, 0, 0.25);
    }

    #user-input {
      flex: 1;

      min-width: 0;

      border: 0;
      outline: 0;
      resize: none;

      background: transparent;
      color: white;

      font-size: 15px;
      line-height: 1.5;

      padding:
        10px 8px;

      max-height: 150px;
    }

    #user-input::placeholder {
      color: #999;
    }

    /* =========================
       TOOL BUTTONS
    ========================= */

    .tool-button {
      width: 40px;
      height: 40px;
      flex-shrink: 0;

      border: 0;
      border-radius: 50%;

      background: transparent;
      color: #bdbdbd;

      font-size: 19px;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.15s ease;
    }

    .tool-button:hover {
      background: var(--surface-hover);
      color: white;
    }

    .tool-button:active {
      transform: scale(0.9);
    }

    .tool-button.active {
      background: #315a9e;
      color: white;
    }

    /* SEND */

    #send-button {
      width: 40px;
      height: 40px;
      flex-shrink: 0;

      border: 0;
      border-radius: 50%;

      background: white;
      color: #111;

      font-size: 19px;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.2s ease;
    }

    #send-button:hover {
      transform: scale(1.05);
    }

    #send-button:active {
      transform: scale(0.92);
    }

    /* =========================
       EMOJI PICKER
    ========================= */

    .emoji-picker {
      position: absolute;

      left: calc(50% - 390px);
      bottom: 82px;

      width: 300px;
      max-height: 250px;

      overflow-y: auto;

      display: none;

      grid-template-columns:
        repeat(8, 1fr);

      gap: 4px;

      padding: 10px;

      background: #2b2b2b;

      border: 1px solid #444;
      border-radius: 15px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.4);

      z-index: 50;
    }

    .emoji-picker.open {
      display: grid;

      animation:
        pickerIn 0.2s ease;
    }

    @keyframes pickerIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .emoji {
      border: 0;

      background: transparent;

      font-size: 21px;

      padding: 5px;

      border-radius: 7px;

      cursor: pointer;
    }

    .emoji:hover {
      background: #404040;
    }

    /* =========================
       SCROLLBAR
    ========================= */

    ::-webkit-scrollbar {
      width: 7px;
    }

    ::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 768px) {

      .sidebar {
        position: fixed;

        top: 0;
        left: 0;
        bottom: 0;

        width: 280px;
        max-width: 82vw;

        transform:
          translateX(-105%);

        box-shadow:
          10px 0 35px
          rgba(0, 0, 0, 0.45);
      }

      .sidebar.open {
        transform:
          translateX(0);
      }

      .main {
        width: 100%;
        min-width: 0;
      }

      .menu-button {
        display: block;
      }

      .topbar {
        height: 58px;
        padding: 0 12px;
      }

      .chat-messages {
        width: 100%;

        padding:
          20px 12px 160px;
      }

      .chat-inner {
        width: 100%;
      }

      .welcome {
        min-height: 60vh;
        padding: 20px;
      }

      .welcome h1 {
        font-size: 25px;
      }

      .welcome-logo {
        width: 68px;
        height: 68px;
      }

      .user-message p {
        max-width: 85%;
      }

      .message-input {
        padding:
          18px 10px 12px;
      }

      .input-box {
        width: 100%;
      }

      .emoji-picker {
        left: 10px;
        bottom: 75px;
        width: 280px;
      }

      .sidebar-overlay {
        display: block;
      }
    }

    /* =========================
       DESKTOP OVERLAY OFF
    ========================= */

    @media (min-width: 769px) {

      .sidebar-overlay {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- MOBILE SIDEBAR OVERLAY -->
    <div
      id="sidebar-overlay"
      class="sidebar-overlay">
    </div>


    <!-- =====================
         SIDEBAR
    ====================== -->

    <aside
      id="sidebar"
      class="sidebar">

      <div class="sidebar-header">

        <div class="brand">

          <img
            src="/logo.png"
            alt="Osman AI"
            class="brand-logo">

          <div class="brand-name">
            Osman AI
          </div>

        </div>

      </div>


      <button
        id="new-chat"
        class="new-chat">

        ＋ New Chat

      </button>


      <div class="sidebar-bottom">

        <strong>Osman AI</strong>

        <br>

        Your personal AI assistant

      </div>

    </aside>


    <!-- =====================
         MAIN
    ====================== -->

    <main class="main">


      <!-- TOP BAR -->

      <header class="topbar">

        <button
          id="menu-button"
          class="menu-button"
          aria-label="Open menu">

          ☰

        </button>


        <img
          src="/logo.png"
          alt="Osman AI"
          class="top-logo">


        <div>

          <strong>
            Osman AI
          </strong>

          <span class="online-dot"></span>

        </div>

      </header>


      <!-- =====================
           CHAT
      ====================== -->

      <section class="chat-container">


        <div
          id="chat-messages"
          class="chat-messages">

          <div class="chat-inner">

            <div class="welcome">

              <img
                src="/logo.png"
                alt="Osman AI"
                class="welcome-logo">


              <h1>
                How can I help you today?
              </h1>


              <p>
                Ask Osman AI anything.
              </p>

            </div>

          </div>

        </div>


        <!-- TYPING -->

        <div
          id="typing-indicator"
          class="typing-indicator">

          Osman AI is thinking

          <span class="dots">
            <span>.</span>
            <span>.</span>
            <span>.</span>
          </span>

        </div>


        <!-- =====================
             INPUT
        ====================== -->

        <div class="message-input">


          <!-- EMOJI PICKER -->

          <div
            id="emoji-picker"
            class="emoji-picker">
          </div>


          <div class="input-box">


            <!-- IMAGE BUTTON -->

            <button
              id="image-button"
              class="tool-button"
              title="Create image"
              type="button">

              🖼️

            </button>


            <!-- EMOJI -->

            <button
              id="emoji-button"
              class="tool-button"
              title="Emoji"
              type="button">

              😊

            </button>


            <!-- TEXT -->

            <textarea
              id="user-input"
              rows="1"
              placeholder="Message Osman AI..."
              autocomplete="off">
            </textarea>


            <!-- SEND -->

            <button
              id="send-button"
              title="Send"
              type="button">

              ↑

            </button>

          </div>

        </div>

      </section>

    </main>

  </div>


  <!-- IMPORTANT:
       Keep your existing Cloudflare chat.js -->

  <script src="chat.js"></script>


  <script>

    /* =========================
       ELEMENTS
    ========================= */

    const input =
      document.getElementById(
        "user-input"
      );

    const sendButton =
      document.getElementById(
        "send-button"
      );

    const messages =
      document.getElementById(
        "chat-messages"
      );

    const sidebar =
      document.getElementById(
        "sidebar"
      );

    const menuButton =
      document.getElementById(
        "menu-button"
      );

    const newChat =
      document.getElementById(
        "new-chat"
      );

    const overlay =
      document.getElementById(
        "sidebar-overlay"
      );

    const emojiButton =
      document.getElementById(
        "emoji-button"
      );

    const emojiPicker =
      document.getElementById(
        "emoji-picker"
      );

    const imageButton =
      document.getElementById(
        "image-button"
      );


    /* =========================
       MOBILE MENU
    ========================= */

    function openSidebar() {

      sidebar.classList.add(
        "open"
      );

      overlay.classList.add(
        "active"
      );

    }


    function closeSidebar() {

      sidebar.classList.remove(
        "open"
      );

      overlay.classList.remove(
        "active"
      );

    }


    menuButton.addEventListener(
      "click",
      () => {

        if (
          sidebar.classList.contains(
            "open"
          )
        ) {

          closeSidebar();

        } else {

          openSidebar();

        }

      }
    );


    overlay.addEventListener(
      "click",
      closeSidebar
    );


    /* =========================
       NEW CHAT
    ========================= */

    newChat.addEventListener(
      "click",
      () => {

        messages.innerHTML = `

          <div class="chat-inner">

            <div class="welcome">

              <img
                src="/logo.png"
                class="welcome-logo"
                alt="Osman AI">

              <h1>
                How can I help you today?
              </h1>

              <p>
                Ask Osman AI anything.
              </p>

            </div>

          </div>

        `;

        closeSidebar();

      }
    );


    /* =========================
       AUTO TEXTAREA SIZE
    ========================= */

    input.addEventListener(
      "input",
      () => {

        input.style.height =
          "auto";

        input.style.height =
          Math.min(
            input.scrollHeight,
            150
          ) + "px";

      }
    );


    /* =========================
       EMOJIS
    ========================= */

    const emojis = [

      "😀","😃","😄","😁",
      "😆","😅","😂","🤣",

      "😊","😇","🙂","🙃",
      "😉","😌","😍","🥰",

      "😘","😎","🤩","🥳",
      "🤔","🤨","😐","😑",

      "😶","🙄","😏","😣",
      "😥","😮","🤐","😯",

      "😪","😫","🥱","😴",
      "🤗","🤭","🤫","🤪",

      "😜","😝","😛","🤑",
      "🤠","😈","👿","🤯",

      "❤️","🧡","💛","💚",
      "💙","💜","🖤","🤍",

      "🔥","✨","⭐","💯",
      "🚀","🎯","💡","💻",

      "👍","👎","👏","🙌",
      "🙏","💪","🤝","👀",

      "🎉","🎊","😭","😱",
      "😡","🥶","🤩","😎"

    ];


    emojiPicker.innerHTML =
      emojis
        .map(
          emoji => `
            <button
              type="button"
              class="emoji">
              ${emoji}
            </button>
          `
        )
        .join("");


    /* OPEN EMOJI */

    emojiButton.addEventListener(
      "click",
      (event) => {

        event.stopPropagation();

        emojiPicker.classList.toggle(
          "open"
        );

      }
    );


    /* INSERT EMOJI */

    emojiPicker.addEventListener(
      "click",
      (event) => {

        if (
          !event.target.classList.contains(
            "emoji"
          )
        ) {

          return;

        }

        const emoji =
          event.target.textContent.trim();

        const start =
          input.selectionStart;

        const end =
          input.selectionEnd;

        input.value =
          input.value.slice(0, start)
          +
          emoji
          +
          input.value.slice(end);

        input.focus();

        input.selectionStart =
          input.selectionEnd =
          start + emoji.length;

        input.dispatchEvent(
          new Event("input")
        );

      }
    );


    /* CLOSE EMOJI WHEN CLICKING OUTSIDE */

    document.addEventListener(
      "click",
      (event) => {

        if (
          !emojiPicker.contains(
            event.target
          ) &&
          event.target !== emojiButton
        ) {

          emojiPicker.classList.remove(
            "open"
          );

        }

      }
    );


    /* =========================
       IMAGE MODE
    ========================= */

    let imageMode = false;


    imageButton.addEventListener(
      "click",
      () => {

        imageMode =
          !imageMode;

        imageButton.classList.toggle(
          "active",
          imageMode
        );


        if (imageMode) {

          input.placeholder =
            "Describe the image you want...";

        } else {

          input.placeholder =
            "Message Osman AI...";

        }

        input.focus();

      }
    );


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHTML(text) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        text;

      return div.innerHTML;

    }


    /* =========================
       SCROLL
    ========================= */

    function scrollToBottom() {

      requestAnimationFrame(
        () => {

          messages.scrollTo({
            top: messages.scrollHeight,
            behavior: "smooth"
          });

        }
      );

    }


    /* =========================
       IMAGE GENERATION
    ========================= */

    async function generateImage(
      prompt
    ) {

      const userMessage =
        document.createElement(
          "div"
        );

      userMessage.className =
        "message user-message";

      userMessage.innerHTML =
        `<p>🖼️ ${escapeHTML(prompt)}</p>`;

      messages.appendChild(
        userMessage
      );


      const assistantMessage =
        document.createElement(
          "div"
        );

      assistantMessage.className =
        "message assistant-message";


      assistantMessage.innerHTML = `

        <img
          src="/logo.png"
          class="assistant-avatar"
          alt="Osman AI">

        <div class="assistant-content">

          Creating your image

          <span class="dots">
            <span>.</span>
            <span>.</span>
            <span>.</span>
          </span>

        </div>

      `;


      messages.appendChild(
        assistantMessage
      );

      scrollToBottom();


      try {

        const response =
          await fetch(
            "/api/image",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                prompt: prompt
              })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Image generation failed."
          );

        }


        assistantMessage.innerHTML = `

          <img
            src="/logo.png"
            class="assistant-avatar"
            alt="Osman AI">

          <div class="assistant-content">

            <img
              src="${data.image}"
              class="generated-image"
              alt="Generated image">

          </div>

        `;


      } catch (error) {

        console.error(
          "Image error:",
          error
        );


        assistantMessage.innerHTML = `

          <img
            src="/logo.png"
            class="assistant-avatar"
            alt="Osman AI">

          <div class="assistant-content">

            Sorry, I couldn't generate
            the image.

            <br><br>

            Please try again.

          </div>

        `;

      }


      scrollToBottom();

    }


    /* =========================
       SEND IMAGE
    ========================= */

    async function sendImagePrompt() {

      const prompt =
        input.value.trim();

      if (!prompt) {
        return;
      }


      input.value = "";

      input.style.height =
        "auto";


      emojiPicker.classList.remove(
        "open"
      );


      imageMode = false;

      imageButton.classList.remove(
        "active"
      );


      input.placeholder =
        "Message Osman AI...";


      await generateImage(
        prompt
      );

    }


    /* =========================
       IMAGE COMMAND
    ========================= */

    input.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          const value =
            input.value.trim();


          if (
            value
              .toLowerCase()
              .startsWith("/image ")
          ) {

            event.preventDefault();

            const prompt =
              value.substring(7).trim();


            if (prompt) {

              input.value = "";

              generateImage(
                prompt
              );

            }

          }

        }

      }
    );


    /* =========================
       INTERCEPT IMAGE BUTTON
    ========================= */

    sendButton.addEventListener(
      "click",
      async () => {

        if (!imageMode) {
          return;
        }


        await sendImagePrompt();

      }
    );

  </script>

</body>
</html>
